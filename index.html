<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>功夫之拳</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="gameWrap">
  <canvas id="game" width="720" height="360"></canvas>
</div>
<div id="hint">
  <span id="hintKeyboard">
    <span class="key">A</span><span class="key">D</span> 移動　
    <span class="key">W</span>/<span class="key">SPACE</span> 跳躍　
    <span class="key">S</span> 蹲下　
    <span class="key">J</span> 揮拳(長按蓄力放波動拳)　
    <span class="key">K</span> 踢腿　
    <span class="key">L</span> 格擋　
    <span class="key">Esc</span>/<span class="key">P</span> 暫停
  </span>
  <span id="hintGamepad" style="display:none;">
    🎮 <span class="key">方向鍵/左搖桿</span> 移動　
    <span class="key">X</span> 揮拳(長按蓄力放波動拳)　
    <span class="key">A</span> 踢腿　
    <span class="key">Y</span> 格擋　
    <span class="key">Start</span> 暫停
  </span>
</div>

<!-- モバイル用バーチャルボタン(タッチデバイス検出時のみJSで表示) -->
<button id="tPause" class="tbtn">II</button>
<button id="tFullscreen" class="tbtn" title="Fullscreen">&#x26F6;</button>
<div id="rotateHint"></div>
<div id="touchControls">
  <div id="tStick">
    <div id="tStickKnob"></div>
  </div>
  <div id="tActions">
    <button class="tbtn" id="tJump">跳</button>
    <button class="tbtn" id="tParry">擋</button>
    <button class="tbtn" id="tKick">踢</button>
    <button class="tbtn" id="tPunch">拳</button>
  </div>
</div>

<!-- Firebase(全球共用の排行榜/ランキング用) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

<script src="js/game.js"></script>
</body>
</html>
